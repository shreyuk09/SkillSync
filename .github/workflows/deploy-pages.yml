# Builds the online demo and publishes it to GitHub Pages on every push to main.
#
# GitHub Pages can only serve static files, so this builds the frontend in
# static mode (VITE_STATIC=1) and pre-computes the demo results for the 10
# sample resumes with backend/scripts/export_static.py. Uploads and the AI
# assistant need the Python backend and are available when run locally.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lite.txt
      - name: Install backend (lite)
        run: pip install -r backend/requirements-lite.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend (static demo)
        working-directory: frontend
        env:
          VITE_STATIC: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Pre-compute demo data
        run: python backend/scripts/export_static.py frontend/dist/demo

      - name: Single-page app fallback
        # GitHub Pages serves 404.html for unknown paths; making it the app
        # lets links like /SkillSync/app/jobs open directly.
        run: cp frontend/dist/index.html frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
